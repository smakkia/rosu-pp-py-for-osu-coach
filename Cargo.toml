[package]
name = "rosu-pp-py"
version = "4.0.2"
edition = "2021"
authors = ["Max Ohn <ohn.m@hotmail.de>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/MaxOhn/rosu-pp-py"
description = "Difficulty and performance calculation for osu!"

[lib]
name = "rosu_pp_py"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.28", features = ["extension-module", "macros"] }
rosu-mods = { version = "0.4.0", default-features = false, features = ["serde"] }
# osu!'s 2026-07-03 pp update, not released yet: pinned to the pp-update branch
rosu-pp = { git = "https://github.com/MaxOhn/rosu-pp", rev = "072ed255fa043aba495212c441030dc7a5e61469", features = ["sync"] }
serde = { version = "1.0.203" }

[profile.release]
lto = true
panic = "abort"
codegen-units = 1
strip = true
