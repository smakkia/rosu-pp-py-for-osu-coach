# Builds only the wheel osu-coach needs (Windows x86_64, Python 3.12) against rosu-pp's unreleased pp-update branch.

name: Build Windows wheel

on:
  push:
    branches:
      - pp-update-2026
  workflow_dispatch:

jobs:
  build:
    name: Build wheel (windows x86_64, Python 3.12)
    runs-on: windows-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Set up python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          args: --release --out dist --interpreter 3.12
          rust-toolchain: stable

      - name: Install and check the wheel
        shell: bash
        run: |
          python -m pip install dist/*.whl
          python .github/check_wheel.py

      - name: Upload wheel
        uses: actions/upload-artifact@v5
        with:
          name: rosu_pp_py-windows-x86_64-cp312
          path: dist
