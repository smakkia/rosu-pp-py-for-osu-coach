# Builds only the wheels osu-coach needs (Windows x86_64, every Python install.ps1 may pick) against rosu-pp's
# unreleased pp-update branch.

name: Build Windows wheel

on:
  push:
    branches:
      - pp-update-2026
  workflow_dispatch:

jobs:
  build:
    name: Build wheels (windows x86_64, Python 3.11-3.14)
    runs-on: windows-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Set up python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          args: --release --out dist --interpreter 3.11 3.12 3.13 3.14
          rust-toolchain: stable

      - name: Install and check the wheel (Python 3.12)
        shell: bash
        run: |
          python -m pip install --no-index --find-links dist rosu-pp-py
          python .github/check_wheel.py

      - name: Upload wheels
        uses: actions/upload-artifact@v5
        with:
          name: rosu_pp_py-windows-x86_64
          path: dist
